# ===================================================================
# SMART PARK - SPRING BOOT CONFIGURATION (MySQL)
# ===================================================================

server.port=8080
spring.application.name=smart-park-backend

# Disable automatic execution of schema.sql by Spring Boot
spring.sql.init.mode=never

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_park_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration (Hibernate automatically detects MySQL dialect)
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# JWT Configuration
# Set JWT_SECRET as a Windows environment variable (or in your CI/CD secrets).
# NEVER hardcode the real secret here — this file is committed to Git.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Logging
logging.level.com.smartpark=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
